        - generic [ref=e181] [cursor=pointer]:
          - heading "我的动物朋友——小狗乐乐" [level=3] [ref=e182]
          - generic [ref=e183]: 作者：四年级学生作品
          - generic [ref=e184]:
            - text: 我有这样一个动物朋友，它不是什么珍稀动物，而是一只普普通通的小狗，名叫“乐乐”。它是我十岁生日时，爸爸从宠物店买回来的。
            - text: 乐乐长得胖乎乎的，一身棕黄色的毛油光发亮，像穿了一件绸缎大衣。它的脑袋圆溜溜的，两只耳朵像小扇子一样耷拉着。一双黑葡萄似的大眼睛，总是水汪汪地看着我，好像在说：“陪我玩一会儿吧！”它的鼻子黑黑的、湿湿的，嗅觉可灵敏了。一条毛茸茸的尾巴，见到我就摇个不停，像一把小扫帚。
            - text: 乐乐是个十足的小吃货。每次我吃饭的时候，它就蹲在我脚边，眼巴巴地望着我，口水都要流出来了。有一次我故意把一块骨头举得高高的，乐乐就站起来用两条后腿走路，像个杂技演员一样，逗得全家哈哈大笑。它不仅贪吃，还特别聪明。我教它“握手”的动作，它很快就学会了。现在只要我一伸手说“握手”，它就会把一只前爪放在我的手心里。
            - text: 乐乐是我最好的朋友。每当我心情不好的时候，它就会蹭蹭我的腿，用舌头舔舔我的手，好像在安慰我。有了乐乐的陪伴，我的生活变得更加丰富多彩。我希望乐乐能一直健康快乐地陪在我身边。记得有一次我发烧了，乐乐就趴在我的床边守了一整夜，一步都不肯离开。第二天妈妈告诉我，乐乐一晚上都没睡好，时不时抬头看看我有没有醒。听了这话，我的眼眶湿润了。
          - generic [ref=e185]:
