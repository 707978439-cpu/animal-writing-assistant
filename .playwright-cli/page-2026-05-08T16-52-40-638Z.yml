          - heading "奶奶家的大公鸡" [level=3] [ref=e191]
          - generic [ref=e192]: 作者：四年级学生作品
          - generic [ref=e193]:
            - text: 奶奶家有一只威武的大公鸡，我给它取名叫“大红”。每次去奶奶家，我总是先跑去看它。
            - text: 大红长得可神气了。它全身披着金红色的羽毛，在阳光下闪闪发光，像一位穿着铠甲的将军。头上顶着一个鲜红的鸡冠，像一顶王冠。一双圆溜溜的小眼睛，炯炯有神。最引人注目的是它那条长长的尾巴，由黑绿相间的羽毛组成，高高翘起，走起路来一摇一摆的，威风极了。
            - text: 大红每天早上天还没亮就开始打鸣。那响亮的声音“喔喔喔”地叫着，好像在说：“快起床啦！太阳晒屁股啦！”它吃东西的时候特别有趣。我把玉米粒撒在地上，它就低下头，用小嘴飞快地啄着，一边吃一边发出“咯咯咯”的声音，好像很满意似的。有一次邻居家的小狗跑过来想抢它的食物，大红毫不示弱，张开翅膀冲了过去，吓得小狗赶紧逃走了。
            - text: 大公鸡大红不仅是奶奶家的“闹钟”，还是奶奶家的“小卫士”。我很喜欢它，每次离开时都要跟它说再见。有一回邻居家的猫想来偷鸡蛋吃，大红发现了，立刻竖起羽毛冲了过去，一边叫一边用嘴啄那只猫。那只猫被啄得狼狈地逃走了。奶奶笑着说：“有大红在，什么都不用怕。”从那以后，我对大红更加敬佩了，它不仅是只会打鸣的公鸡，还是一个勇敢的小卫士呢！
          - generic [ref=e194]:
            - generic [ref=e195]: "#四年级"
