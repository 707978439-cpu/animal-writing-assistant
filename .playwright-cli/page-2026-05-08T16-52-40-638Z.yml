        - generic [ref=e172] [cursor=pointer]:
          - heading "可爱的小白兔" [level=3] [ref=e173]
          - generic [ref=e174]: 作者：三年级学生作品
          - generic [ref=e175]:
            - text: 我最喜欢的小动物是小白兔。去年暑假，奶奶从乡下给我带回来一只，我高兴极了。
            - text: 小白兔全身雪白雪白的，摸上去毛茸茸的，像一团棉花。它的脑袋圆圆的，头顶上竖着两只长长的耳朵，只要有一点声音，就会立刻竖起来，可机灵了。它有一双红宝石般的眼睛，一闪一闪的，特别好看。它的嘴巴是三瓣嘴，吃东西的时候一动一动的，非常可爱。身体后面有一个又短又圆的小尾巴，像一个白色的小毛球。
            - text: 小白兔最爱吃胡萝卜和青菜叶。每次我拿着胡萝卜走过去，它就会用后腿站起来，前爪扒着笼子，好像在说：“快给我！快给我！”我把胡萝卜放进笼子里，它就抱着胡萝卜津津有味地啃起来，三瓣嘴一动一动的，看得我都饿了。
            - text: 小白兔是我的好朋友，每天放学回家我都要先去看看它，给它喂食、换水。它给我带来了无数欢乐。有一次我给它喂了一根胡萝卜，它吃得太急了，不小心咬到了我的手。虽然有点疼，但我知道它不是故意的，我还是很喜欢它。我希望小白兔能一直健康快乐地陪着我。
          - generic [ref=e176]:
