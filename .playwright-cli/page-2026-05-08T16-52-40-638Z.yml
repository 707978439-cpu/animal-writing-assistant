        - generic [ref=e208] [cursor=pointer]:
          - heading "惠州西湖的白鹭" [level=3] [ref=e209]
          - generic [ref=e210]: 作者：四年级学生作品 · 惠州特色
          - generic [ref=e211]:
            - text: 我的家乡在惠州，这里有美丽的西湖。每到周末，爸爸都会带我去西湖边散步，我最喜欢看湖面上的白鹭。
            - text: 白鹭全身披着雪白的羽毛，像一位穿着白纱裙的仙子。它的脖子又细又长，常常弯成优雅的S形。一双细长的腿站在浅水中，一动不动地等待着猎物。正如课本中《白鹭》一文所写：“那雪白的蓑毛，那全身的流线型结构，那铁色的长喙，那青色的脚”，真是美极了。
            - text: 有一次，我看见一只白鹭静静地站在水边，眼睛紧紧盯着水面。突然，它闪电般地把长嘴伸进水里，叼起一条小鱼，仰起头吞了下去。那动作快得我差点没看清！吃饱后，它张开宽大的翅膀，在湖面上低低地飞着，翅膀轻轻扇动，像一朵白云在飘动。
            - text: 惠州西湖因为有了这些白鹭，变得更加生动美丽。我为家乡有如此美丽的景色感到骄傲。
          - generic [ref=e212]:
