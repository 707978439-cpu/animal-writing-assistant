          - heading "我家的小金鱼" [level=3] [ref=e164]
          - generic [ref=e165]: 作者：三年级学生作品
          - generic [ref=e166]:
            - text: 我家有一条可爱的小金鱼，名叫“泡泡”。它是我去年生日时妈妈送给我的礼物。
            - text: 泡泡的身体是金红色的，像穿着一件闪闪发光的外衣。它的眼睛大大的、圆圆的，总是好奇地东张西望。最漂亮的是它的尾巴，像一把透明的小扇子，在水中轻轻摆动的时候，就像跳舞一样优美。
            - text: 泡泡最喜欢在鱼缸里游来游去。每当我去喂它的时候，它就会飞快地游到水面，小嘴巴一张一合地等着。我把鱼食撒下去，它就一口一个，吃得可快了。有一次，我故意把手指放在鱼缸外面，泡泡以为有吃的，就游过来用嘴巴碰了碰玻璃，好像在说：“快给我吃的呀！”真是有趣极了。
            - text: 我喜欢我的小金鱼泡泡，它给我的生活带来了许多快乐。每当我写作业累了，看看它在水里自由自在地游着，心情就会好起来。有一次我考试考得不好，回到家闷闷不乐。泡泡好像看出了我的心思，就在鱼缸里转着圈游来游去，还吐出一串小泡泡，好像在逗我开心。看着它无忧无虑的样子，我的烦恼一下子就没有了。
          - generic [ref=e167]:
