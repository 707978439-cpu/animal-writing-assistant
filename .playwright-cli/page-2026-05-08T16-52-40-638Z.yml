        - generic [ref=e217] [cursor=pointer]:
          - heading "罗浮山的小松鼠" [level=3] [ref=e218]
          - generic [ref=e219]: 作者：三年级学生作品 · 惠州特色
          - generic [ref=e220]:
            - text: 周末，爸爸妈妈带我去惠州的罗浮山玩。罗浮山可高可美了，山上长满了大树。在树林里，我看见了一只可爱的小松鼠。
            - text: 小松鼠的身体小小的，披着一身灰褐色的毛，油亮亮的。它有一条毛茸茸的大尾巴，翘得高高的，像一把小伞。它的眼睛黑溜溜的，像两颗小黑豆，总是警惕地东张西望。它的两只前爪小小的，特别灵活，捧着松果的样子就像我们捧着零食一样可爱。
            - text: 小松鼠在树枝间跳来跳去，动作可敏捷了。这时我想起课文里学过的“松鼠是一种美丽的小动物，乖巧，驯良”（六年级上册《跑进家来的松鼠》），简直和眼前这只一模一样！
            - text: 罗浮山的小松鼠给我们的旅行带来了许多快乐。我把一片红叶带回家夹在书里，每次看到它就会想起那只可爱的松鼠。
