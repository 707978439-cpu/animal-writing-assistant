        - generic [ref=e199] [cursor=pointer]:
          - heading "我和小猫“雪球”的故事" [level=3] [ref=e200]
          - generic [ref=e201]: 作者：五年级学生作品
          - generic [ref=e202]:
            - text: 去年冬天的一个雪夜，我在回家的路上捡到了一只流浪猫。它浑身雪白，蜷缩在墙角瑟瑟发抖，一双蓝宝石般的眼睛可怜巴巴地望着我。我心一软，就把它抱回了家。因为它是在雪天捡到的，我给它取名“雪球”。
            - text: 雪球是一只漂亮的波斯猫。它的毛又长又软，像冬天的雪花一样洁白。两只尖尖的小耳朵警惕地竖着，一有动静就会轻轻抖动。最迷人的是它那双蓝宝石般的大眼睛，白天瞳孔缩成一条线，到了晚上就会变得又圆又大，发出幽幽的蓝光。它走起路来悄无声息，身后拖着一条蓬松的大尾巴，优雅得像一位公主。
            - text: 雪球的到来给我家带来了许多欢乐，也闹出了不少笑话。有一次妈妈织毛衣，把毛线球放在沙发上。雪球以为是新玩具，扑上去就用爪子拨弄起来。结果毛线滚了一地，它自己被缠得团团转，像一个小雪人似的滚来滚去，把我和妈妈笑得直不起腰。还有一次，我写作业时把它放在书桌上，它倒好，直接趴在我的作业本上呼呼大睡，还打起了小呼噜，好像在说：“别写了，陪我睡觉吧。”
            - text: 雪球虽然有时候很调皮，但它也非常贴心。每当我生病不舒服的时候，它就会安静地趴在我的枕头边，用温热的身体给我取暖。我难过的时候，它会用头蹭蹭我的手，好像在安慰我。渐渐地，雪球已经不再是一只流浪猫，而是我们家庭中不可或缺的一员。
            - text: 从捡到雪球到现在已经一年了。看着它从瘦弱的小猫变成现在圆滚滚的模样，我深深感受到：每一个小生命都值得被温柔以待。雪球给了我快乐和陪伴，我也会一直好好照顾它。
          - generic [ref=e203]:
            - generic [ref=e204]: "#五年级"
